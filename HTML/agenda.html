<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>
    <link rel="stylesheet" href="../CSS/agenda.css">
</head>

<body>

    <div class="titulo">
        <h1>Agenda</h1>
    </div>

    <div class="calendario">

        <div class="mtd_agnd_1">

            <div class="escolher_mes">

                <button id="mes_anterior">&lt;</button>

                <h1 class="mes" id="nome_mes">Agosto</h1>

                <button id="proximo_mes">&gt;</button>

            </div>

            <hr>

            <ul class="dias_semana">
                <li>DOM</li>
                <li>SEG</li>
                <li>TER</li>
                <li>QUA</li>
                <li>QUI</li>
                <li>SEX</li>
                <li>SÁB</li>
            </ul>

            <!-- Os dias serão criados pelo JS -->
            <ul class="dias_mes" id="dias_mes"></ul>

        </div>


        <div class="mtd_agnd_2">

            <h1>Eventos</h1>

            <!-- Botão para adicionar evento -->
            <div class="adicionar_evento" id="adicionar_evento">
                <span>+</span>
            </div>

            <!-- Eventos do dia selecionado -->
            <div class="evento_conteudo" id="evento_conteudo">

                <p>Selecione um dia.</p>

            </div>

        </div>

    </div>

    <script src="../JS/agenda.js"></script>

</body>

</html>
