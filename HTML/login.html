<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
    <div class="metade_1">
        <h1>"Educação é a arma mais poderosa para mudar o mundo."</h1>
        <p>- Nelson Mandela</p>
    </div>

    <div class="metade_2">
        <div class="circulo cima"></div>

        <form class="formulario">
            <h1>Login</h1>

            <label for="email">@escola</label>
            <input type="email" placeholder="Insira o seu @escola">

            <label for="senha">senha</label>
            <input type="password" placeholder="Insira a sua senha">
            
            <button type="submit">Entrar</button>
           
        </form>

        <div class="circulo embaixo"></div>


    </div>

    <script src="../JS/login.js"></script>
</body>
</html>
